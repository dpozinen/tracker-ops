zoe:
  host: 192.168.0.132
  truenas:
    url: https://192.168.0.184
    api-key: /sensitive/trueNas
    tls:
      enabled: false
    keystore-path: /Users/dpozinenko/IdeaProjects/1337xto/src/main/resources/keystore.jks
    truststore-path: /Users/dpozinenko/IdeaProjects/1337xto/src/main/resources/tracker_ops_trust_store
    stores-password: changeit
  plex:
    url: http://192.168.0.184:32400
    api-key: /sensitive/plex
  deluge:
    url: 192.168.0.184:18112
    folders:
      root: /Downloads
      download: /Downloads/running
      done: /Downloads/done
      show: /Downloads/Show
      film: /Downloads/Film
    stats:
      enabled: false
      follow:
        resume-on-startup: true
        duration: 3d
        datapoints-per-download: '{ "1d": 1000, "2d": 800, "3d": 600, "10d": 400, "30d": 200 }'
        initial-delay: 20s
      poll-interval: 5m
  health:
    heartbeat:
      cron: '0 30 * * * *'
    telegram:
      healthcheck:
        cron: '*/30 * * * * *'
      host: "https://api.telegram.org"
      bot-segment: TG_HC_BOT_SEGMENT
  music:
    cron: '0 0 3 * * *'
    spotify:
      client-id: ${SPOTIFY_CLIENT_ID}
      client-secret: ${SPOTIFY_CLIENT_SECRET}
      refresh-token: ${SPOTIFY_REFRESH_TOKEN}
      include-collaborative: false
      additional-playlists: []
    sockseek:
      url: http://sockseek:5030

server:
  port: 8133

spring:
  kafka:
    template:
      default-topic: stats
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
